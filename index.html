<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b6b58"><title>DELF50 · 50天 B1 冲刺</title><style>:root{--bg:#f4f7f5;--card:#fff;--ink:#18332d;--muted:#6c7d78;--line:#dfe9e5;--brand:#0b6b58;--brand2:#0a5d4d;--soft:#e9f4f0;--warn:#8a5a12;--warnbg:#fff6df;--bad:#7c403d;--badbg:#fbefee;--good:#225d49;--goodbg:#e8f5ef;--blue:#2e5f8a;--bluebg:#edf5fb}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,textarea,input,select{font:inherit}.app{max-width:860px;margin:auto;min-height:100vh;padding:18px 14px 92px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin:4px 0 12px}.eyebrow{font-size:11px;letter-spacing:.12em;font-weight:800;color:var(--brand)}h1{margin:4px 0 2px;font-size:28px}h2{font-size:19px;margin:8px 0}h3{font-size:15px;margin:8px 0}.muted{color:var(--muted);font-size:12px;line-height:1.6}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 8px 28px rgba(20,60,50,.045)}.hero{background:linear-gradient(145deg,#0e745f,#095849);color:white;border:0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.wrap{flex-wrap:wrap}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{border:1px solid var(--line);background:#fbfdfc;border-radius:13px;padding:11px}.metric b{display:block;font-size:19px;margin-top:3px}.metric span{font-size:10px;color:var(--muted)}.hero .metric{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.12)}.hero .metric span{color:#d7e9e3}.pill{display:inline-block;font-size:10px;font-weight:750;background:var(--soft);color:#42655d;border-radius:999px;padding:6px 8px;margin:2px 4px 2px 0}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.blue{background:var(--bluebg);color:var(--blue)}.barrow{margin:10px 0}.barlabel{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}.bar{height:8px;background:#e8efed;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand)}.btn{border:0;background:var(--brand);color:#fff;font-weight:800;border-radius:13px;padding:12px 14px;cursor:pointer}.btn.secondary{background:white;color:var(--ink);border:1px solid var(--line)}.btn.warn{background:#8a5a12}.btn.small{padding:8px 10px;font-size:11px}.btn:disabled{opacity:.45;cursor:not-allowed}.dayctl{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.dayctl input{width:78px;border:1px solid var(--line);border-radius:11px;padding:9px}.dayctl select{border:1px solid var(--line);border-radius:11px;padding:9px;background:white}.task{display:grid;grid-template-columns:52px 1fr auto;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);align-items:start}.task:last-child{border-bottom:0}.time{font-size:12px;font-weight:800;color:var(--brand);background:var(--soft);padding:7px 6px;border-radius:10px;text-align:center}.task b{font-size:14px}.task .desc{font-size:12px;line-height:1.55;color:var(--muted);margin-top:4px}.check{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:white;color:var(--muted);cursor:pointer}.check.done{background:var(--brand);color:white;border-color:var(--brand)}.callout{padding:11px 12px;border-radius:12px;font-size:12px;line-height:1.65}.callout.good{background:var(--goodbg);color:var(--good)}.callout.warn{background:var(--warnbg);color:var(--warn)}.callout.bad{background:var(--badbg);color:var(--bad)}.callout.blue{background:var(--bluebg);color:var(--blue)}.tabs{display:flex;gap:6px;overflow:auto;padding-bottom:4px}.tabs button{border:1px solid var(--line);background:white;border-radius:999px;padding:8px 12px;white-space:nowrap}.tabs button.on{background:var(--brand);color:white;border-color:var(--brand)}.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:white;border-radius:12px;padding:11px;margin:7px 0;cursor:pointer}.opt.on{border-color:var(--brand);background:#eef8f4}.opt.good{border-color:#53917c;background:var(--goodbg)}.opt.bad{border-color:#c3847f;background:var(--badbg)}.node{padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}.node:last-child{border-bottom:0}.node.current{background:#f2f8f6;margin:0 -8px;padding:12px 8px;border-radius:12px}.textarea{width:100%;min-height:165px;border:1px solid var(--line);border-radius:13px;padding:12px;resize:vertical;margin:8px 0}.source{font-size:11px;line-height:1.55;color:var(--muted)}.source a{color:var(--brand);text-decoration:none}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(860px,100%);display:grid;grid-template-columns:repeat(6,1fr);background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:7px 4px max(7px,env(safe-area-inset-bottom));z-index:20}.nav button{border:0;background:transparent;color:#73837f;font-size:10px;padding:5px 2px}.nav button b{display:block;font-size:16px;margin-bottom:3px}.nav button.on{color:var(--brand);font-weight:800}.rec{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.timer{font-weight:900;font-size:24px}.statusdot{width:9px;height:9px;border-radius:50%;background:#aaa;display:inline-block;margin-right:5px}.statusdot.live{background:#c13c35}.storage{font-size:11px;color:var(--muted);margin-top:6px}.divider{height:1px;background:var(--line);margin:12px 0}.errorpage{margin:30px auto;max-width:680px;background:#fff;border:1px solid #efcbc8;border-radius:16px;padding:18px;color:#7b3b38}.empty{text-align:center;color:var(--muted);font-size:12px;padding:18px}.nowrap{white-space:nowrap}@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}.task{grid-template-columns:46px 1fr auto}.top{display:block}.dayctl{margin-top:10px}.nav button b{font-size:14px}}.fallback{max-width:860px;margin:auto;padding:24px 14px}.loadstatus{display:inline-block;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800;background:#fff6df;color:#8a5a12}.loadstatus.ok{background:#e8f5ef;color:#225d49}.loadstatus.bad{background:#fbefee;color:#7c403d}#root[hidden],#fallback[hidden]{display:none!important}</style></head><body><div id="fallback" class="fallback"><h1>Day 1 · 阶段1 · 语法手感</h1><div class="card"><div class="row wrap"><div><b>DELF50 · 50天 B1 冲刺</b><div class="muted"><span id="releaseVersion">正在读取版本</span> · 正在加载今日课程与学习记录。</div></div><span id="loaderStatus" class="loadstatus">正在校验 0/13</span></div><div id="loaderError" class="callout warn" style="margin-top:12px">当前仍为静态模式。即使网络资源异常，页面也不会白屏。</div></div><div class="card hero"><h2>6.5小时 今日计划</h2><div class="muted" style="color:#d8eee8">语法 10 道 + 8 个主动产出 · 应用3项 · 听力3组 · 阅读3篇 · 写作1项 · 口语3轮</div></div><div class="card"><div class="task"><div class="time">85<br>min</div><div><b>语法专项</b><div class="desc">识别 → 变形 → 纠错 → 造句 → 情境调用。</div></div><div class="check">→</div></div><div class="task"><div class="time">60<br>min</div><div><b>应用专项</b><div class="desc">真实任务：请求、叙事、建议、投诉与观点。</div></div><div class="check">→</div></div><div class="task"><div class="time">100<br>min</div><div><b>听读训练</b><div class="desc">分阶段听力和阅读，客观题才进入正确率。</div></div><div class="check">→</div></div></div></div><div id="root" hidden></div><script src="/release-meta.js"></script><script src="/cloud/delf50-cloud.js"></script><script>(()=>{'use strict';const REL=window.__DELF50_RELEASE||{app:'—',content:'—',cacheKey:'release'};const rv=document.getElementById('releaseVersion');if(rv)rv.textContent='App '+REL.app+' · 内容版本 '+REL.content;const FILES=["base/data-a.js","base/data-b1.js","base/data-b2.js","base/app-a1.js","base/app-a2.js","base/app-a3.js","base/app-b.js","v13-p1.js","v13-p2.js","v13-p3.js","v13-p4.js","v13-p5.js","v15-patch.js"];const status=document.getElementById('loaderStatus'),err=document.getElementById('loaderError'),fallback=document.getElementById('fallback'),root=document.getElementById('root');let current='',runtimeError=null;window.addEventListener('error',e=>{runtimeError={file:current,message:String(e.message||e.error||'unknown error')};});function setStatus(text,cls=''){status.textContent=text;status.className='loadstatus '+cls;}const BOOT='parallel-retry-v1';window.__DELF50_BOOT={version:BOOT,status:'loading',loaded:0,total:FILES.length};async function getText(file,i){let last=null;for(let attempt=1;attempt<=3;attempt++){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),30000);try{const r=await fetch('/api/source?i='+i+'&v='+encodeURIComponent(REL.cacheKey)+'&attempt='+attempt,{cache:'no-store',signal:controller.signal});if(!r.ok)throw new Error(file+' HTTP '+r.status);const code=await r.text();if(!code||code.length<20)throw new Error(file+' empty source');return code;}catch(e){last=e;if(attempt<3)await new Promise(resolve=>setTimeout(resolve,300*attempt));}finally{clearTimeout(timer);}}throw new Error(file+' 加载失败：'+String(last&&last.message||last));}function exec(code,name){runtimeError=null;current=name;const s=document.createElement('script');s.text=code+'\n//# sourceURL='+name;document.body.appendChild(s);s.remove();if(runtimeError)throw new Error(runtimeError.file+': '+runtimeError.message);}(async()=>{try{let loaded=0;setStatus('并行校验 0/'+FILES.length);const codes=await Promise.all(FILES.map((file,i)=>getText(file,i).then(code=>{loaded++;window.__DELF50_BOOT.loaded=loaded;setStatus('正在校验 '+loaded+'/'+FILES.length);return code;})));setStatus(FILES.length+'/'+FILES.length+' 完整，按顺序启动');for(let i=0;i<FILES.length;i++)exec(codes[i],FILES[i]);window.__DELF50_BOOT.status='ready';root.hidden=false;fallback.hidden=true;setStatus('交互已启动','ok');}catch(e){console.error(e);window.__DELF50_BOOT.status='error';window.__DELF50_BOOT.error=String(e.message||e);root.hidden=true;fallback.hidden=false;setStatus('仅静态模式','bad');err.className='callout bad';err.textContent='完整交互未启动：'+String(e.message||e)+'。系统已自动重试；学习记录不会被清空。';}})();})();</script></body></html>
